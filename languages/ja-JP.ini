AboutApp = [互換性]\r\n 1 = Windows 11、10、8.1、8、7、Vista に対応\r\n 2 = 64 ビット / 32 ビット OS に対応\r\n 3 = 高 DPI に対応（150% で最適）\r\n\r\n[オープンソース]\r\n 1 = 開発言語: C#、WPF、MIT ライセンス\r\n 2 = GitHub: https://github.com/Jack251970/ContextMenuManager \r\n 3 = Gitee: https://gitee.com/Jack251970/ContextMenuManager \r\n\r\n[注意事項]\r\n 1 = このプログラムは多数のシステムファイルやレジストリを読み書きします。\r\n これらは影響の大きい操作のため、Windows Defender などにマルウェアと判定されることがあります。その場合は除外リストに追加してください。\r\n\r\n 2 = 特殊なメニュー項目の中には、他の要因によって右クリックメニューに表示されないものがあります。\r\n その場合でも、このプログラムでは一般的な判定ルールに従って「有効」と表示されることがありますが、正常な動作です。\r\n\r\n 3 = 右クリックメニュー管理ツールごとに、メニューを無効にする方法は異なります。複数のツールを同時に使わないでください。\r\n 多くのツールは単純な「バックアップして削除」方式ですが、このプログラムは OS が用意している値を使って、できるだけ削除せずに非表示にします。\r\n 以前に別のツールで無効にした項目は、そのツールで元に戻してください。戻さないと、このプログラムでは表示されない場合があります。\r\n\r\n 4 = このプログラムは、アンインストール済みプログラムの残骸を掃除するためのものではありません。ただし、そうしたメニュー項目のレジストリやファイルの場所を探す手助けにはなります。\r\n 慣れていない場合（または意味のわからない設定がある場合）は、有効 / 無効の切り替えだけを使うと OS を壊す危険を減らせます。

Dictionaries = [辞書の説明]\r\n このプログラムにはいくつかの辞書ファイルがあり、それぞれにユーザー辞書（User フォルダー）と Web 辞書（Web フォルダー）があります。\r\n 辞書に項目を追加したい場合は、右クリックでファイルを User フォルダーに保存し、ファイル内の説明に従って追加してください。\r\n 右側のタブには元の辞書の内容が表示され、タブを切り替えて確認・編集・保存できます。\r\n\r\n[辞書の内容]\r\n 1 = プログラムの表示テキストの言語辞書（Languages フォルダー）\r\n 2 = ShellEx メニュー項目の GUID・名前・アイコン辞書（GuidInfosDic.ini）\r\n 3 = システムや他のプログラムの内部メニューの詳細設定辞書（DetailedEditDic.xml）\r\n 4 = 拡張メニュー項目の辞書（EnhanceMenusDic.xml）\r\n 5 = UWP モジュールの辞書（UwpModeItemsDic.xml）\r\n\r\n※ Windows 11 の新しいメニューに出るアプリ（パッケージ）の項目は、辞書に無くても設定で自動検出できます。

Donate = このプログラムは完全に無料です。役に立ったと感じたら、\r\n下の QR コード（WeChat、Alipay、Tencent QQ）から寄付できます。\r\n金額はお任せします。ご支援ありがとうございます。\r\nGitHub や Gitee でこのプロジェクトにスターを付けていただけると、とても励みになります。

